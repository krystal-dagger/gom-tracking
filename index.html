      ${roster.length && openOrders.length ? '<div class="formacts"><button class="btn ghost" data-action="syncCb">Add claimers to open orders again</button></div><p class="small muted" style="margin:8px 0 0">Adds anyone missing. Existing claims are kept.</p>' : ''}</section>` : ''}

    ${soft.length ? `<section class="panel"><h2>Soft claimers: drops joined</h2>
      <p class="small muted" style="margin-top:0">Soft claimers need to join at least ${min} drops of this comeback. A drop counts when a claim is going through or waiting on more members.</p>
      <div style="overflow-x:auto"><table class="pv"><thead><tr><th>Joiner</th><th>Soft spots</th><th class="r">Joined</th><th>Status</th></tr></thead><tbody>
      ${soft.map(s => `<tr><td>${esc(`${emoOf.get(s.id) || ''} ${jById.get(s.id).name}`.trim())}</td><td>${esc(s.spots.join(', '))}</td><td class="r">${s.joined} of ${min}</td>
        <td>${s.status === 'met' ? '<span class="pill sea">Met</span>' : s.status === 'behind' ? `<span class="pill gold">${min - s.joined} to go</span>` : `<span class="pill coral">At risk, ${s.left} open</span>`}</td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
}
function anOf2(g, cs, cb) { return hasSets(g) ? analyze(g, cs, cb) : null; }

async function adminBody(tab) {
  if (tab === 'money') return (await crudTab('payments')) + (await crudTab('charges'));
  if (tab === 'claims') return claimsTab();
  if (tab === 'comeback') return comebackTab();
  if (tab === 'caption') return captionTab();
  return crudTab(tab);
}
function adminLoginView() {
  return `<div class="signin">${head('Host login', 'For the host only. Joiners can use My account instead.')}
    <form class="panel stack" data-form="adminlogin">
      <div class="field"><label for="ae">Email</label><input id="ae" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="ap">Password</label><input id="ap" name="password" type="password" autocomplete="current-password" required></div>
      <p class="err" id="adminErr" role="alert"></p><button class="btn">Sign in</button>
      ${DEMO ? '<p class="small muted" style="margin:0">Demo: any email, password <b>demo</b>.</p>' : ''}
    </form></div>`;
}
async function pageAdmin() {
  if (!A.checked) { A.is = await api.isAdmin(); A.checked = true; }
  if (!A.is) return adminLoginView();
  let body; try { body = await adminBody(A.tab); } catch (e) { body = `<div class="panel"><p class="err">${esc(e.message)}</p></div>`; }
  return head('Host tools', 'Only you can see this page.') + `<div class="tabs" role="tablist">${ADMIN_TABS.map(([k, l]) => `<button role="tab" aria-selected="${k === A.tab}" data-action="tab" data-tab="${k}">${l}</button>`).join('')}<button class="btn ghost small" data-action="adminOut">Sign out</button></div>${body}`;
}

/* =====================================================================
   12. Router + events
   ===================================================================== */
const app = $('#app');
const PAGES = {drops:pageDrops, calendar:pageCalendar, orders:pageOrders, me:pageMe, admin:pageAdmin};
const TITLES = {drops:'Comeback drops', calendar:'Calendar', orders:'Order status', me:'My account', admin:'Host tools'};
let renderId = 0;
const routeName = () => { const r = location.hash.replace(/^#\/?/, '').split('/')[0]; return PAGES[r] ? r : 'drops'; };

async function render() {
  const id = ++renderId, r = routeName();
  document.querySelectorAll('[data-r]').forEach(a => { if (a.dataset.r === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = TITLES[r] + ' | ' + CONFIG.INSTAGRAM + ' group orders';
  let html;
  try {
    if (window.__bootError) throw window.__bootError;
    if (S.loadError) throw S.loadError;
    html = await PAGES[r]();
  } catch (e) {
    html = `<div class="panel"><h2>Something went wrong</h2><p class="err">${esc(e.message || e)}</p><p class="muted small">Check the Supabase URL and key in index.html, and that schema.sql ran without errors.</p></div>`;
  }
  if (id === renderId) app.innerHTML = html;
}

const actions = {
  signout() { S.me = null; session.del('jo'); render(); },
  clearFilters() { S.filters = {q:'', store:'', type:'', status:''}; render(); },
  async adminOut() { await api.adminSignOut(); A.is = false; A.data = {}; render(); },
  tab(b) { A.tab = b.dataset.tab; A.preview = null; render(); },
  async edit(b) { A.edit[b.dataset.key] = b.dataset.id; await render(); const f = $(`form[data-key="${b.dataset.key}"]`); if (f) f.scrollIntoView({block:'center'}); },
  cancelEdit(b) { delete A.edit[b.dataset.key]; render(); },
  async del(b) {
    const cfg = CFG[b.dataset.key], row = A.data[cfg.table].find(r => r.id === b.dataset.id);
    const ok = await ask({title:`Delete "${cfg.label(row)}"?`, html:'<p>This can\'t be undone.' + (cfg.table === 'joiners' ? ' Their claims, fees, and payments are deleted too.' : '') + '</p>', ok:'Delete', danger:true});
    if (!ok) return;
    await api.remove(cfg.table, row.id);
    if (cfg.table === 'drops' && (row.images || []).length) api.removeImages(row.images).catch(() => {});
    invalidate(cfg.table, 'claims'); await refreshPublic(); toast('Deleted'); render();
  },
  async pin(b) {
    const j = A.data.joiners.find(x => x.id === b.dataset.id);
    const r = await ask({title:`Set PIN for ${j.name}`, html:'<div class="field"><label for="pinIn">New PIN (4 or more characters)</label><input id="pinIn" name="pin" type="text" minlength="4" autocomplete="off" required></div><p class="small muted">Send them this PIN privately. They sign in on My account with their handle and this PIN.</p>', ok:'Save PIN'});
    if (!r) return;
    await api.setPin(j.id, r.pin); invalidate('joiners');
    toast(DEMO ? 'Demo mode does not store PINs. Sign in with 1234.' : 'PIN saved'); render();
  },
  previewClaims() {
    const go = A.data.group_orders.find(g => g.id === A.goId);
    A.claimText = $('#claimText').value; A.preview = buildPreview(A.claimText, go); render();
  },
  async commitClaims() {
    const go = A.data.group_orders.find(g => g.id === A.goId), pv = A.preview; if (!pv) return;
    const newOnes = pv.rows.filter(r => !r.joinerId);
    for (const r of newOnes) {
      const j = await api.save('joiners', {name:r.handle, emoji:null});
      await api.save('joiner_accounts', {handle:r.handle, joiner_id:j.id, platform:'instagram'});
      r.joinerId = j.id;
    }
    let t = Date.now(); const host = await ensureHost();
    const rows = pv.rows.flatMap(r => r.claims.map(c => ({group_order_id:go.id, joiner_id:r.joinerId, member_code:c.code, items:c.items, price:c.price, status:'filled', source:r.joinerId === host ? 'gom' : 'joiner', created_at:new Date(t++).toISOString()})));
    await api.saveMany('claims', rows);
    if (go.comeback_id && go.roster_required) await syncOrder(go, null, {add:false});      // sort them into fixed, soft and extra
    invalidate('joiners', 'joiner_accounts'); await refreshPublic();
    A.preview = null; A.claimText = '';
    toast(`Added ${rows.length} claims${newOnes.length ? `. ${newOnes.length} new joiners need a PIN and emoji in the Joiners tab` : ''}`); render();
  },
  async toggleClaim(b) { await api.save('claims', {id:b.dataset.id, status:b.dataset.status === 'filled' ? 'dropped' : 'filled'}); await refreshPublic(); render(); },
  async delClaim(b) {
    const ok = await ask({title:'Delete this claim?', html:'<p>Use "Mark dropped" instead if the joiner dropped it and you want to keep a record.</p>', ok:'Delete', danger:true});
    if (!ok) return; await api.remove('claims', b.dataset.id); await refreshPublic(); render();
  },
  qty(b) {
    const inp = $('input[name="q"]', b.parentElement), v = Math.max(0, Math.min(Number(inp.max) || 10, (parseInt(inp.value, 10) || 0) + Number(b.dataset.d)));
    inp.value = v; b.closest('.mchip').classList.toggle('on', v > 0); claimNote(b.closest('form'));
  },
  async unclaim(b) {
    const c = cred(), claim = S.me && S.me.claims.find(x => x.id === b.dataset.id); if (!c || !claim) return;
    const g = goById(claim.group_order_id), cb = cbOf(g);
    const back = claim.source === 'fixed' || claim.source === 'soft' ? `If you add ${esc(claim.member_code)} back you go to the end of the ${claim.source} claimers, still ahead of everyone else.` : 'If you add it back you join the end of the line for that member.';
    const ok = await ask({title:`Drop ${claim.member_code}?`, html:`<p>You won't be charged for it. ${back}</p>${claim.source === 'fixed' ? '<p><b>Heads up:</b> this is a fixed claim. You are dropping it because you have an OT8.</p>' : ''}${claim.source === 'soft' && cb ? `<p><b>Heads up:</b> soft claimers need to join at least ${cb.soft_min_orders} drops of ${esc(cb.name)}.</p>` : ''}`, ok:'Drop claim', danger:true});
    if (!ok) return;
    const res = await api.joinerUnclaim(c.h, c.p, b.dataset.id);
    if (res.error) { toast(claimError(res), true); return; }
    await refreshPublic(); await doLogin(c.h, c.p, true); await keepScroll(render); toast('Claim dropped');
  },
  previewRoster() { A.rosterText = $('#rosterText').value; A.rosterPv = parseRoster(A.rosterText, CONFIG.INSTAGRAM); render(); },
  async saveRoster() {
    const pv = A.rosterPv, cb = A.data.comebacks.find(c => c.id === A.cbId); if (!pv || !cb || pv.unknown.length || !pv.entries.length) return;
    const accounts = new Map(A.data.joiner_accounts.map(a => [a.handle, a.joiner_id])), idOf = new Map(), emojiOf = new Map();
    for (const e of pv.entries) {
      emojiOf.set(e.handle, e.emoji);
      if (idOf.has(e.handle)) continue;
      let jid = accounts.get(e.handle);
      if (!jid) { const j = await api.save('joiners', {name:e.handle, emoji:e.emoji}); await api.save('joiner_accounts', {handle:e.handle, joiner_id:j.id, platform:'instagram'}); jid = j.id; accounts.set(e.handle, jid); }
      idOf.set(e.handle, jid);
    }
    await api.clearRoster(cb.id);
    await api.saveMany('comeback_roster', pv.entries.map(e => ({comeback_id:cb.id, tier:e.tier, member_code:e.member_code, position:e.position, waitlist:e.waitlist, joiner_id:idOf.get(e.handle)})));
    await api.saveMany('comeback_emojis', [...emojiOf].map(([hd, emoji]) => ({comeback_id:cb.id, joiner_id:idOf.get(hd), emoji})));
    await api.save('comebacks', {id:cb.id, fixed_slots:pv.slots.fixed, soft_slots:pv.slots.soft});
    invalidate('joiners', 'joiner_accounts', 'comebacks', 'claims'); A.rosterPv = null; A.rosterText = '';
    await ensureHost();
    const r = await syncComeback(cb.id); await refreshPublic();
    toast(`List saved. ${r.added} ${r.added === 1 ? 'claim' : 'claims'} added${r.updated ? `, ${r.updated} moved to the right place in line` : ''} across ${r.orders} open ${r.orders === 1 ? 'order' : 'orders'}.`); render();
  },
  async syncCb() { const r = await syncComeback(A.cbId); await refreshPublic(); toast(r.added || r.updated ? `Added ${r.added} ${r.added === 1 ? 'claim' : 'claims'}${r.updated ? `, moved ${r.updated} into the right place in line` : ''} across ${r.orders} open orders.` : 'Everyone is already on the open orders.'); render(); },
  async syncOrder() {
    const go = A.data.group_orders.find(g => g.id === A.goId); if (!go || !go.comeback_id) return;
    const r = await syncOrder(go); await refreshPublic(); toast(r.added || r.updated ? `Added ${r.added} ${r.added === 1 ? 'claim' : 'claims'}${r.updated ? `, moved ${r.updated} into the right place in line` : ''}.` : 'Everyone is already on this order and in the right place.'); render();
  },
  async copyRoster() {
    const t = $('#rosterText').value;
    try { await navigator.clipboard.writeText(t); } catch { const ta = $('#rosterText'); ta.select(); document.execCommand('copy'); }
    toast('List copied');
  },
  async clearRosterBtn() {
    const ok = await ask({title:'Remove the saved list?', html:'<p>This clears the fixed and soft claimers and their emojis for this comeback. Claims already on orders are not removed.</p>', ok:'Remove list', danger:true});
    if (!ok) return; await api.clearRoster(A.cbId); A.rosterText = ''; A.rosterPv = null; await refreshPublic(); toast('List removed'); render();
  },
  lb(b) { openLightbox(b.dataset.gal, Number(b.dataset.i) || 0); },
  async calSel(b) {
    const d = b.dataset.date; CAL.sel = d; CAL.month = d.slice(0, 7);
    await render(); refocus(`[data-action="calSel"][data-date="${d}"]`);
  },
  async calMove(b) {
    const step = b.dataset.step, [Y, M] = CAL.month.split('-').map(Number);
    if (step === 'today') { CAL.month = today().slice(0, 7); CAL.sel = today(); }
    else { CAL.month = ymd(new Date(Y, M - 1 + Number(step), 1)).slice(0, 7); CAL.sel = CAL.month === today().slice(0, 7) ? today() : CAL.month + '-01'; }
    await render(); refocus(`[data-action="calMove"][data-step="${step}"]`);
  },
  async calView(b) { CAL.view = b.dataset.view; await render(); refocus(`[data-action="calView"][data-view="${CAL.view}"]`); },
  async calKind(b) { const k = b.dataset.kind; CAL.kinds[k] = !CAL.kinds[k]; await render(); refocus(`[data-action="calKind"][data-kind="${k}"]`); },
  imgDel(b) { const w = b.closest('[data-imgs]'), list = readImgs(w); list.splice(Number(b.dataset.i), 1); writeImgs(w, list); $('[data-imgmsg]', w).textContent = 'Removed. Press the save button to keep this change.'; },
  imgFirst(b) { const w = b.closest('[data-imgs]'), list = readImgs(w), [x] = list.splice(Number(b.dataset.i), 1); list.unshift(x); writeImgs(w, list); $('[data-imgmsg]', w).textContent = 'Cover changed. Press the save button to keep this change.'; },
  async copyCaption() {
    const text = $('#capText').textContent;
    try { await navigator.clipboard.writeText(text); } catch {
      const r = document.createRange(); r.selectNodeContents($('#capText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges();
    }
    toast('Caption copied');
  },
};
const forms = {
  async login(f) {
    const fd = new FormData(f), err = $('#loginErr');
    err.textContent = '';
    try { await doLogin(fd.get('handle'), fd.get('pin')); render(); } catch (e) { err.textContent = e.message; }
  },
  async claimlogin(f) {
    const fd = new FormData(f), err = $('[data-err]', f); err.textContent = '';
    try { await doLogin(fd.get('handle'), fd.get('pin')); await keepScroll(render); } catch (e) { err.textContent = e.message; }
  },
  async claim(f) {
    const goId = f.dataset.go, err = $('[data-err]', f); err.textContent = '';
    const members = []; f.querySelectorAll('input[name="q"]').forEach(i => { const k = Math.max(0, Math.min(10, parseInt(i.value, 10) || 0)); for (let j = 0; j < k; j++) members.push(i.dataset.code); });
    if (!members.length) { err.textContent = 'Pick at least one member.'; return; }
    const c = cred(); if (!c) { S.me = null; render(); return; }
    const res = await api.joinerClaim(c.h, c.p, goId, members);
    if (res.error) {
      err.textContent = claimError(res);
      if (res.error === 'invalid' || res.error === 'locked') { S.me = null; session.del('jo'); }
      return;
    }
    await refreshPublic(); await doLogin(c.h, c.p, true);
    const g = goById(goId), an = anOf(g);
    const waits = an && S.me ? S.me.claims.filter(x => x.group_order_id === goId && x.status === 'filled' && claimInfo(g, x, an).state === 'wait').length : 0;
    const counts = new Map(); members.forEach(m => counts.set(m, (counts.get(m) || 0) + 1));
    await keepScroll(render);
    toast(`Claimed ${[...counts].map(([m, k]) => k > 1 ? `${m} x${k}` : m).join(', ')}${waits ? `. Some of your claims are on the waitlist` : ''}`);
  },
  async adminlogin(f) {
    const fd = new FormData(f), err = $('#adminErr'); err.textContent = '';
    try {
      await api.adminSignIn(fd.get('email'), fd.get('password'));
      A.is = await api.isAdmin();
      if (!A.is) throw new Error('You are signed in, but this account is not set up as host yet. See step 2 in README.md.');
      render();
    } catch (e) { err.textContent = e.message; }
  },
  async crud(f) {
    const key = f.dataset.key, cfg = CFG[key], row = readForm(cfg, f), editId = A.edit[key];
    if (key === 'drops') {
      if (row.event_end_on && !row.event_on) throw new Error('Add the event date first, or clear the last day.');
      if (row.event_end_on && row.event_end_on < row.event_on) throw new Error('The last day is before the event date.');
    }
    const oldImgs = key === 'drops' && editId ? ((A.data.drops.find(r => r.id === editId) || {}).images || []) : [];
    if (editId) row.id = editId;
    let handles = null;
    if (key === 'joiners') { handles = (row.handles || '').split(/[\s,]+/).map(normHandle).filter(Boolean); delete row.handles; if (!handles.length) handles = [normHandle(row.name)]; row.name = row.name.replace(/^@/, ''); }
    if (key === 'group_orders') {
      const rowsN = row.album_type === 'Digipack (Unit)' ? 4 : 8;
      if (row.min_members != null && !(Number.isInteger(row.min_members) && row.min_members >= 1 && row.min_members <= rowsN)) throw new Error(`Members needed for a set must be a whole number from 1 to ${rowsN}.`);
      if (row.claims_on_site && row.price_per_pc == null) throw new Error('Set a price before joiners can claim on this site.');
    }
    const oldGo = key === 'group_orders' && editId ? A.data.group_orders.find(r => r.id === editId) : null;
    if (key === 'group_orders' && row.status === 'cancelled') toast('Tip: mark that order\'s claims as dropped or refund them so balances stay right.');
    const saved = await api.save(cfg.table, row);
    const notes = [];
    if (key === 'group_orders') {
      const go = {...(oldGo || {}), ...row, ...saved};
      if (oldGo && (num(oldGo.price_per_pc) !== num(go.price_per_pc) || num(oldGo.ot8_price) !== num(go.ot8_price))) { const n = await repriceClaims(oldGo, go); if (n) notes.push(`${n} claim ${n === 1 ? 'price' : 'prices'} updated`); }
      if (go.comeback_id && go.roster_required && go.status === 'open') { const r = await syncOrder(go); if (r.added) notes.push(`${r.added} comeback ${r.added === 1 ? 'claimer' : 'claimers'} added`); }
    }
    if (handles) await api.setHandles(saved.id || editId, handles);
    if (key === 'drops') { const gone = oldImgs.filter(o => !(row.images || []).some(n => n.src === o.src)); if (gone.length) api.removeImages(gone).catch(() => {}); }
    delete A.edit[key]; invalidate(cfg.table, 'joiner_accounts'); await refreshPublic();
    if (!(key === 'group_orders' && row.status === 'cancelled')) toast(['Saved', ...notes].join('. '));
    render();
  },
};
const refocus = sel => { const el = $(sel); if (el) el.focus(); };
async function guard(fn, ...args) { try { await fn(...args); } catch (e) { toast(e.message || String(e), true); } }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b || !actions[b.dataset.action]) return;
  e.preventDefault(); guard(actions[b.dataset.action], b);
});
app.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f || !forms[f.dataset.form]) return;
  e.preventDefault(); guard(forms[f.dataset.form], f);
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.name === 'q' && t.closest('form[data-form="claim"]')) { t.closest('.mchip').classList.toggle('on', (parseInt(t.value, 10) || 0) > 0); claimNote(t.closest('form')); return; }
  if (!t.dataset.filter) return;
  S.filters[t.dataset.filter] = t.value; $('#dropList').innerHTML = dropList();
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter) { S.filters[t.dataset.filter] = t.value; $('#dropList').innerHTML = dropList(); return; }
  if (t.matches('[data-imgfile]')) { guard(addPhotos, t); return; }
  if (t.name === 'q' && t.closest('form[data-form="claim"]')) {
    const f = t.closest('form'); t.closest('.mchip').classList.toggle('on', (parseInt(t.value, 10) || 0) > 0); claimNote(f); return;
  }
  if (t.dataset.cal === 'past') { CAL.past = t.checked; render().then(() => refocus('[data-cal="past"]')); return; }
  if (t.dataset.pick === 'go') { A.goId = t.value; A.preview = null; render(); return; }
  if (t.dataset.pick === 'cb') { A.cbId = t.value; A.rosterPv = null; A.rosterText = ''; render(); return; }
  if (t.hasAttribute('data-part')) {
    const row = t.closest('.prow'), jid = t.dataset.joiner;
    guard(async () => {
      await api.save('participants', {group_order_id:A.goId, joiner_id:jid,
        shipping_type:$('[data-field="shipping_type"]', row).value || null,
        shipped:$('[data-field="shipped"]', row).checked,
        tracking:$('[data-field="tracking"]', row).value.trim() || null});
      toast('Saved');
    });
  }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

// theme toggle
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(prefs.get('theme'));
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; applyTheme(next); prefs.set('theme', next);
});

/* =====================================================================
   13. Start
   ===================================================================== */
$('#ig-handle').textContent = '@' + CONFIG.INSTAGRAM;
if (DEMO) $('#demo-slot').innerHTML = '<div class="demo">Demo mode with sample data. Nothing you do here is saved. Add your Supabase keys in index.html to go live.</div>';
(async () => {
  if (api) { try { await refreshPublic(); } catch (e) { S.loadError = e; } }
  render();
})();
})();
