<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>krystal_dagger group orders</title>
<meta name="description" content="Check your ATEEZ group order claims, balance, and shipping, and see the latest comeback drops.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B4%E2%80%8D%E2%98%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* light */
  --bg:#f1f5f9; --panel:#ffffff; --panel-2:#e8eff6; --line:#d2deea;
  --text:#12222f; --muted:#556b80;
  --gold:#8f5a05; --gold-bg:#fbedc9;
  --sea:#0b746a;  --sea-bg:#d6f2ee;
  --coral:#b13a2a; --coral-bg:#fde2dc;
  --btn:#12222f; --btn-ink:#ffffff; --focus:#1b64c4;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  background:var(--bg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1520; --panel:#122030; --panel-2:#172a3d; --line:#243a50;
    --text:#e7eef6; --muted:#90a6bc;
    --gold:#f0bb55; --gold-bg:#3b2d0f;
    --sea:#66d8ca;  --sea-bg:#11373a;
    --coral:#ff9887; --coral-bg:#45231f;
    --btn:#f0bb55; --btn-ink:#201703; --focus:#86b8ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1520; --panel:#122030; --panel-2:#172a3d; --line:#243a50;
  --text:#e7eef6; --muted:#90a6bc;
  --gold:#f0bb55; --gold-bg:#3b2d0f;
  --sea:#66d8ca;  --sea-bg:#11373a;
  --coral:#ff9887; --coral-bg:#45231f;
  --btn:#f0bb55; --btn-ink:#201703; --focus:#86b8ff;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0}
h1{font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1.08;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px/1 var(--display);text-decoration:none;letter-spacing:-.01em}
.brand-mark{font-size:26px}
.brand small{display:block;font:500 12px/1.2 var(--body);color:var(--muted);margin-top:4px;letter-spacing:0}
nav{display:flex;gap:4px;margin-left:auto}
nav a{padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}
nav a:hover{color:var(--text)}
nav a[aria-current="page"]{color:var(--text);background:var(--panel-2)}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}
@media(max-width:640px){
  .bar-in{flex-wrap:wrap;gap:8px 12px}
  .brand small{display:none}
  .icon-btn{margin-left:auto}
  nav{order:3;width:100%;margin:0;overflow-x:auto}
  nav a{padding:8px 10px;font-size:14.5px}
}
.demo{background:var(--gold-bg);color:var(--gold);padding:9px 20px;font-size:14px;text-align:center}
.page{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
.head{margin:6px 0 24px}
.sub{color:var(--muted);margin:10px 0 0;max-width:62ch}
.foot{max-width:1080px;margin:0 auto;padding:0 20px 44px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* controls */
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:42px}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.btn{font:600 15px/1 var(--body);background:var(--btn);color:var(--btn-ink);border:1px solid transparent;border-radius:10px;padding:12px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--coral);border-color:var(--coral)}
.btn.small{padding:7px 12px;min-height:34px;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:8px}
@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}

/* pills, chips */
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.gold{background:var(--gold-bg);color:var(--gold)}
.pill.sea{background:var(--sea-bg);color:var(--sea)}
.pill.coral{background:var(--coral-bg);color:var(--coral)}
a.pl{text-decoration:none}
.chip{display:inline-block;font:600 12px/1 var(--body);padding:5px 7px;border-radius:6px;background:var(--panel-2);margin:0 4px 4px 0}
.chip.x{text-decoration:line-through;color:var(--muted);opacity:.75}
.tag{font-weight:600;font-size:12.5px;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.new{margin-left:6px;font-size:11.5px;font-weight:700;color:var(--gold);background:var(--gold-bg);border-radius:6px;padding:1px 6px}

/* drops list */
.dlist{border-top:1px solid var(--line)}
.drop{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.drop-date{font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.drop h3{font-weight:600;font-size:17px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:5px 0 0;color:var(--muted);font-size:14px}
.drop-r{display:flex;align-items:center;gap:12px}
@media(max-width:640px){.drop{grid-template-columns:1fr;gap:6px}}
.empty{padding:32px 0;text-align:center;color:var(--muted)}

/* order cards */
.sect{margin:0 0 34px}
.sect h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sect .sub{margin:4px 0 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.gocard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.gohead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gocard h3{font-weight:600;font-size:18px;line-height:1.25;display:flex;gap:10px;align-items:center}
.em{font-size:26px;line-height:1}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps span{height:6px;border-radius:3px;background:var(--panel-2)}
.steps .done{background:var(--sea)} .steps .now{background:var(--gold)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:3px 8px}
details.fold{margin-top:10px} details.fold>summary{cursor:pointer;font:600 20px/1.2 var(--display);padding:6px 0;margin-bottom:12px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.box{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.box:first-child{border-top:0}
.box b{font:600 16px var(--display)}
.box .emos{font-size:20px;letter-spacing:2px;word-break:break-word}
.box small{display:block;color:var(--muted);font-size:13px}
@media(max-width:640px){.box{grid-template-columns:1fr auto}.box .emos{grid-column:1/-1}}

/* joiner dashboard */
.me-head{display:flex;align-items:center;gap:18px;margin:4px 0 22px;flex-wrap:wrap}
.sticker{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--panel);border:2px solid var(--gold);box-shadow:0 0 0 6px var(--panel-2);flex:none}
.me-head .signout{margin-left:auto}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.ledger>div{padding:20px 22px;border-left:1px solid var(--line);min-width:0}
.ledger>div:first-child{border-left:0}
.ledger .k{color:var(--muted);font-size:14px;font-weight:500}
.ledger .v{font:700 clamp(24px,3vw,32px)/1.15 var(--display);font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:-.01em}
.ledger .s{color:var(--muted);font-size:13px;margin-top:6px}
.owed .v{color:var(--coral)} .clear .v{color:var(--sea)} .credit .v{color:var(--gold)}
.track{height:6px;border-radius:3px;background:var(--panel-2);margin-top:12px;overflow:hidden}
.fill{height:100%;background:var(--sea)}
@media(max-width:820px){
  .ledger{grid-template-columns:1fr 1fr}
  .ledger>div:nth-child(3){border-left:0}
  .ledger>div:nth-child(n+3){border-top:1px solid var(--line)}
}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:14px}
.two .panel{margin-bottom:0}
.panel>h2{font-size:16px;font-weight:600;color:var(--muted);margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:12px;padding:16px 10px;text-align:center;background:var(--panel-2)}
.tile b{display:block;font:700 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.filled{background:var(--sea-bg)} .tile.filled b{color:var(--sea)}
.tile.dropped{background:var(--coral-bg)} .tile.dropped b{color:var(--coral)}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.kv:first-of-type{border-top:0;padding-top:0}
.kv .n{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.kv .p{font-weight:600;font-variant-numeric:tabular-nums;min-width:82px;text-align:right}
.future{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.future:first-of-type{border-top:0}
.pay{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--coral-bg);border-radius:18px;padding:18px 22px;margin-bottom:14px}
.pay>div{flex:1;min-width:220px} .pay strong{font:700 20px var(--display);color:var(--coral)}
.pay p{margin:4px 0 0;color:var(--text);font-size:14.5px}
h2.blk{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:30px 0 12px}
.orow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 96px minmax(0,1.3fr) minmax(0,1.4fr);gap:14px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.orow:first-child{border-top:0}
.orow.hd{color:var(--muted);font-size:13px;font-weight:600;background:var(--panel-2)}
.orow .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.orow .nm{font-weight:600}
.prow2{display:grid;grid-template-columns:90px minmax(0,1fr) 110px 100px;gap:14px;padding:12px 20px;border-top:1px solid var(--line);align-items:center}
.prow2:first-child{border-top:0}
.prow2 .r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
@media(max-width:820px){
  .orow{grid-template-columns:1fr 1fr;row-gap:10px}
  .orow.hd{display:none}
  .orow .nm{grid-column:1/-1}
  .orow .r{text-align:left}
  .orow>div[data-l]::before{content:attr(data-l);display:block;color:var(--muted);font-size:12px;font-weight:500}
  .prow2{grid-template-columns:1fr auto}
  .prow2>:nth-child(2){grid-column:1/-1;order:3}
}
.signin{max-width:420px;margin:24px auto 0}
.signin .panel{padding:26px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:13.5px;font-weight:600;color:var(--muted)}
.field small{color:var(--muted);font-size:12.5px}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px}
.check input{width:auto;min-height:0}
.stack{display:grid;gap:14px}
.err{color:var(--coral);font-weight:600;font-size:14.5px;min-height:1.4em;margin:0}

/* host tools */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;margin:0 0 18px;border-bottom:1px solid var(--line);align-items:center}
.tabs button{font:600 14.5px/1 var(--body);border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.tabs .btn{margin-left:auto;flex:none}
.split{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:22px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.split>.panel{margin-bottom:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formacts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.arow{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.arow:first-child{border-top:0}
.arow small{display:block;color:var(--muted);font-size:13.5px}
.arow strong{font-weight:600}
.acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.pad{padding:18px}
.prow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.prow:first-child{border-top:0}
@media(max-width:820px){.prow{grid-template-columns:1fr 1fr}.prow>:first-child{grid-column:1/-1}}
.cap{white-space:pre-wrap;font:16px/1.7 var(--body);background:var(--panel-2);border-radius:12px;padding:16px;margin:0;overflow-x:auto}
table.pv{width:100%;border-collapse:collapse;font-size:14.5px}
table.pv th,table.pv td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
table.pv th{color:var(--muted);font-weight:600;font-size:13px;border-top:0}
.issues{margin:10px 0 0;padding-left:18px;color:var(--coral);font-size:14.5px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:22px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(5,10,16,.6)}
dialog h3{font-size:19px;margin-bottom:12px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.bad{background:var(--coral);color:#fff}

/* photocard thumbnails and viewer */
.pc{display:block;position:relative;flex:none;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--panel-2);aspect-ratio:55/85;cursor:zoom-in;box-shadow:0 0 0 1px var(--line)}
.pc img{display:block;width:100%;height:100%;object-fit:cover}
.pc .n{position:absolute;right:3px;bottom:3px;min-width:18px;text-align:center;background:rgba(9,17,26,.8);color:#fff;font:700 11px/1 var(--body);padding:3px 5px;border-radius:999px}
.pc .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(9,17,26,.62);color:#fff;font:700 17px var(--display)}
.pc-ph{display:grid;place-items:center;flex:none;aspect-ratio:55/85;border-radius:6px;background:var(--panel-2);box-shadow:0 0 0 1px var(--line);font-size:22px}
.drop-main{display:flex;gap:14px;align-items:center;min-width:0}
.drop-main>div{min-width:0}
.drop-main .pc,.drop-main .pc-sp{width:46px;flex:none}
@media(max-width:640px){.drop-main .pc-sp{display:none}}
.pcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dt{color:var(--text);font-weight:600}
dialog.lb{padding:0;width:calc(100% - 24px);max-width:540px;overflow:hidden}
.lb-in{padding:14px;display:grid;gap:10px}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lb-img{display:block;width:100%;max-height:min(68vh,720px);object-fit:contain;border-radius:10px;background:var(--panel-2)}
.lb-cap{margin:0;font-weight:600;text-align:center;min-height:1.5em}
.lb-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* calendar */
.k-deadline{--k:var(--coral);--kb:var(--coral-bg)}
.k-announce{--k:var(--gold);--kb:var(--gold-bg)}
.k-event{--k:var(--sea);--kb:var(--sea-bg)}
.calbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.calnav{display:flex;align-items:center;gap:8px}
.calnav h2{font-size:22px;font-weight:700;letter-spacing:-.01em;min-width:9.5ch;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:600 14.5px/1 var(--body);border:0;background:transparent;color:var(--text);padding:10px 16px;cursor:pointer;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.kchip{display:inline-flex;align-items:center;gap:7px;font:600 13.5px/1 var(--body);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px;cursor:pointer}
.kchip i{width:10px;height:10px;background:var(--k);border-radius:50%;flex:none}
.kchip.k-deadline i{border-radius:2px}
.kchip.k-event i{transform:rotate(45deg);border-radius:1px}
.kchip[aria-pressed="true"]{background:var(--kb);color:var(--k);border-color:var(--k)}
.kchip[aria-pressed="false"] i{opacity:.4}
.month{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk.hd>div{padding:9px 6px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);background:var(--panel-2)}
.day{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-height:108px;padding:6px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;text-align:left;cursor:pointer;min-width:0}
.day:nth-child(7n+1){border-left:0}
.day.out{background:var(--bg);color:var(--muted)}
.day.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.dn{font-size:13.5px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.today .dn{background:var(--btn);color:var(--btn-ink)}

  INSTAGRAM: 'krystal_dagger',
  PAYPAL: 'https://paypal.me/krystaldagger',
  VENMO: 'https://venmo.com/u/kdagley14',

const DEMO = !(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

/* =====================================================================
   2. Constants
   ===================================================================== */
const MEMBERS = ['HJ','SH','YH','YS','SN','MG','WY','JH'];
const ALBUM_TYPES = ['Photobook','Digipack (Member)','Digipack (Unit)','POCA','Other'];
const STATUSES = [['open','Claims open'],['ordered','Ordered'],['at_kaddy','At kaddy'],['in_transit','On the way to host'],['on_hand','On hand'],['completed','Shipped to joiners'],['cancelled','Cancelled']];
const STATUS_LABEL = Object.fromEntries(STATUSES);
const FLOW = ['open','ordered','at_kaddy','in_transit','on_hand','completed'];
const SHIP_STATUSES = [['pending','Not packed yet'],['packed','Packed'],['shipping_paid','Shipping paid'],['shipped','On the way'],['delivered','Arrived']];
const SHIP_LABEL = Object.fromEntries(SHIP_STATUSES);
const DROP_STATUSES = [['announced','Announced'],['planned','GO planned'],['go_open','Claims open'],['skipped','Not hosting']];
const DROP_FILTER = {go_open:'Claims open',go_running:'Order running',planned:'GO planned',announced:'Announced',skipped:'Not hosting'};
const SHIPPING_TYPES = ['US Stamped','US Tracked','WW Tracked','w/ Other GO','In Person','Local Pickup'];
const IMG_BUCKET = 'drop-images', MAX_IMGS = 12;
const SET_MODES = [['none','No set rules (claims are never waitlisted or dropped)'],['drop','Drop sets that are not filled enough'],['split','Split the cost of unclaimed members'],['sort','Sort: order exactly the number of claims']];
const SET_MODE_SHORT = {none:'No set rules', drop:'Drop short sets', split:'Split unclaimed members', sort:'Sorted order'};
const EVT_NAME = {FC:'Fancall', FS:'Fansign', LD:'Lucky draw'};
const EVT_SHORT = {FC:'Call', FS:'Sign', LD:'Draw'};
const KIND_ORDER = ['deadline', 'announce', 'event'];
const KINDS = {deadline:{label:'Order deadlines', pill:'coral'}, announce:{label:'Winner announcements', pill:'gold'}, event:{label:'Fancall and fansign dates', pill:'sea'}};

/* =====================================================================
   3. Small helpers
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v) || 0;
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const sum = (arr, f) => r2(arr.reduce((a, x) => a + num(f(x)), 0));
const money = n => (num(n) < 0 ? '-' : '') + '$' + Math.abs(num(n)).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDate = d => d ? new Date(String(d).slice(0,10) + 'T00:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric'}) : '';
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => new Date(String(s).slice(0,10) + 'T00:00:00');
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysFromNow = s => Math.round((parseD(s) - parseD(today())) / 864e5);
const isoDaysAgo = n => addDays(today(), -n);
const fmtLong = d => d ? parseD(d).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) : '';
const fmtFull = d => d ? parseD(d).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'}) : '';
const whenChip = d => { const n = daysFromNow(d); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : n > 1 ? `in ${n} days` : `${-n} days ago`; };
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now();
const normHandle = h => String(h || '').trim().replace(/^@/, '').toLowerCase();
const isUnitGO = g => g && g.album_type === 'Digipack (Unit)';
const byNewest = (a, b) => (b.created_at || '').localeCompare(a.created_at || '');
const mkStore = area => ({
  get(k){ try { return window[area].getItem(k); } catch { return null; } },
  set(k, v){ try { window[area].setItem(k, v); } catch {} },
  del(k){ try { window[area].removeItem(k); } catch {} },
});
const session = mkStore('sessionStorage'), prefs = mkStore('localStorage');

let toastTimer;
function toast(msg, bad) {
  const t = $('#toast');
  t.innerHTML = `<div class="toast${bad ? ' bad' : ''}">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.innerHTML = ''; }, bad ? 6000 : 2600);
}

function ask({title, html = '', ok = 'Save', danger = false}) {
  return new Promise(resolve => {
    const d = document.createElement('dialog');
    d.innerHTML = `<form><h3>${esc(title)}</h3>${html}<div class="dlg-actions"><button type="button" class="btn ghost" data-x>Cancel</button><button class="btn${danger ? ' danger' : ''}">${esc(ok)}</button></div></form>`;
    document.body.append(d);
    const form = $('form', d);
    const done = v => { try { d.close(); } catch {} d.remove(); resolve(v); };
    form.addEventListener('submit', e => { e.preventDefault(); done(Object.fromEntries(new FormData(form))); });
    $('[data-x]', d).addEventListener('click', () => done(null));
    d.addEventListener('cancel', e => { e.preventDefault(); done(null); });
    d.showModal();
    const first = $('input,select,textarea', d); if (first) first.focus();
  });
}

/* =====================================================================
   3b. Set rules engine: seats, waitlists, going-through, split cost
   ===================================================================== */
/* ENGINE START */
const UNIT_ROWS = ['HJ/SH','YH/MG','YS/WY','SN/JH'];
// Who is first in a member's line: GOM, then fixed claimers, then soft claimers, then the extra claims of fixed and
// soft claimers, then everyone else. Inside a group: your list order, then claim time. A spot that was dropped and
// added again has no list position, so it goes to the end of its group.
const RANK = {gom:0, fixed:1, soft:2, extra:3, joiner:4, host:4};
const claimCmp = (a, b) => (RANK[a.source || 'joiner'] ?? 4) - (RANK[b.source || 'joiner'] ?? 4)
  || (a.roster_pos ?? 1e9) - (b.roster_pos ?? 1e9)
  || String(a.created_at || '').localeCompare(String(b.created_at || ''))
  || String(a.id || '').localeCompare(String(b.id || ''));
const rowsOf = go => go && go.album_type === 'Digipack (Unit)' ? UNIT_ROWS : MEMBERS;
const hasSets = go => !!go && !!go.set_mode && go.set_mode !== 'none';
const ceilCent = x => Math.ceil(x * 100 - 1e-9) / 100;

// Every member has one line of claims, in priority order. Spot n in a line = set n.
// A set goes through when enough members have a claim in it. Sets fill in order, so the sets going through are
// always 1..N, and the waitlist is everything after N. OT8 claims are not part of the grid: they are always ordered.
function analyze(go, claims, cb) {
  const R = rowsOf(go), mode = go.set_mode, unit = R === UNIT_ROWS;
  const min = Math.min(R.length, Math.max(1, num(go.min_members) || R.length));
  const closed = go.status !== 'open' || !!(go.deadline && today() > String(go.deadline).slice(0, 10));
  const gated = mode === 'drop' || mode === 'split';
  const live = claims.filter(c => c.status !== 'dropped').sort(claimCmp);
  const ot8 = live.filter(c => c.member_code === 'OT8');
  const rowSeats = {}, seats = [];
  R.forEach(r => { rowSeats[r] = live.filter(c => c.member_code === r).map((claim, i) => ({claim, row:r, pos:i + 1})); seats.push(...rowSeats[r]); });
  const longest = Math.max(0, ...R.map(r => rowSeats[r].length));
  const countAt = n => R.filter(r => rowSeats[r].length >= n).length;
  let N = 0; if (gated) { while (N < longest && countAt(N + 1) >= min) N++; } else N = longest;
  const total = Math.max(1, longest, gated ? N + 1 : 0);      // a waitlist column is always shown after the sets going through
  const sets = [];
  for (let n = 1; n <= total; n++) {
    const cells = {}; R.forEach(r => { cells[r] = rowSeats[r][n - 1] || null; });
    const missing = R.filter(r => !cells[r]), count = R.length - missing.length;
    const status = n <= N ? (count === R.length ? 'full' : 'go') : !count ? 'empty' : closed ? 'dropped' : 'wait';
    // split: unclaimed members' cost is shared by the claims in the set (rounded up to the cent)
    const extra = mode === 'split' && n <= N && missing.length ? ceilCent(missing.length * num(go.price_per_pc) / count) : 0;
    sets.push({n, cells, count, missing, status, extra, need: n > N ? Math.max(0, min - count) : 0});
  }
  const STATE = {full:'in', go:'in', dropped:'dropped', wait:'wait'};
  seats.forEach(st => { const set = sets[st.pos - 1]; st.set = set; st.state = STATE[set.status]; st.extra = set.extra; });
  const going = sets.filter(x => x.status === 'full' || x.status === 'go');
  const rowCount = {}, toOrder = {}, next = {};
  R.forEach(r => {
    rowCount[r] = rowSeats[r].length;
    toOrder[r] = (mode === 'sort' ? rowSeats[r].length : N) + ot8.length;
    next[r] = rowSeats[r].length + 1;
  });
  const waitSet = sets.find(x => x.n > N && x.count);
  return {go, cb, mode, R, N, min, closed, gated, sets, seats, ot8, rowCount, toOrder, next, claimed: seats.length + ot8.length,
    going: going.length,
    items: R.reduce((a, r) => a + toOrder[r], 0),
    unclaimed: mode === 'sort' ? 0 : going.reduce((a, x) => a + x.missing.length, 0),
    waitlisted: seats.filter(x => x.state === 'wait').length,
    dropped: seats.filter(x => x.state === 'dropped').length,
    waitSets: sets.filter(x => x.status === 'wait').length,
    nextNeed: waitSet && !closed ? {n:waitSet.n, need:waitSet.need} : null};
}

// What one claim means: where it landed, whether it is charged, and how much. OT8 is always charged.
function claimInfo(go, claim, an) {
  const price = num(claim.price), none = {amount:0, base:0, extra:0, pendingBase:0, seats:[], inCount:0, total:1};
  if (claim.status === 'dropped') return {...none, state:'dropped'};
  const full = {state:'in', amount:price, base:price, extra:0, pendingBase:0, seats:[], inCount:1, total:1};
  if (claim.member_code === 'OT8') return {...full, ot8:true};
  if (!hasSets(go) || !an) return full;
  const st = an.seats.find(s => s.claim.id === claim.id);
  if (!st) return full;
  if (st.state === 'in') return {...full, amount:r2(price + st.extra), extra:st.extra, seats:[st]};
  return {...none, state:st.state, pendingBase: st.state === 'wait' ? price : 0, seats:[st]};
}

const seatLabel = (st, an) => st.pos > an.N ? `Waitlist #${st.pos - an.N}` : `Set ${st.pos}`;
function placeText(info, an) {
  if (info.ot8) return 'Ordered no matter what';
  if (!an || !info.seats.length) return info.state === 'dropped' ? 'Dropped' : '';
  const st = info.seats[0], L = seatLabel(st, an);
  return st.state === 'in' ? `${L}, going through` : st.state === 'wait' ? `${L}, not ordered unless its set fills up` : `${L}, not ordered`;
}
function setNote(x, an) {
  const W = an.R === UNIT_ROWS ? 'units' : 'members', of = `${x.count} of ${an.R.length} ${W}`;
  if (x.status === 'full') return `Set ${x.n}: full, going through`;

  const rr = (tier, m, h, position, waitlist) => D.comeback_roster.push({id:uid(), comeback_id:'cb1', tier, member_code:m, position, waitlist, joiner_id:'j-' + h});
  MEMBERS.forEach(m => {
    FIX[m].forEach((h, i) => rr('fixed', m, h, i + 1, false));
    SOFT[m].forEach((h, i) => rr('soft', m, h, i + 1, false));
    (SOFT_WAIT[m] || []).forEach((h, i) => rr('soft', m, h, SOFT[m].length + i + 1, true));
  });
  new Set(D.comeback_roster.map(r => r.joiner_id)).forEach(id => D.comeback_emojis.push({comeback_id:'cb1', joiner_id:id, emoji:D.joiners.find(j => j.id === id).emoji}));
  [kong, th].forEach(g => rosterDesired(g, D.comeback_roster.filter(r => r.comeback_id === g.comeback_id))
    .forEach(d => addClaim(d.joiner_id, g, d.member_code, 'filled', undefined, d.joiner_id === 'j-krystal_dagger' ? 'gom' : d.source, d.roster_pos)));

  // the joiner you can sign in as
  const me = 'j-demo_joiner';
  addClaim(me, fromm, 'HJ/SH'); addClaim(me, fromm, 'YH/MG');
  addClaim(me, mini, 'SN'); addClaim(me, mini, 'JH', 'dropped');
  addClaim(me, jjmuze, 'YS');
  addClaim(me, book, 'Day and Night');
  addClaim(me, mk4, 'SH'); addClaim(me, mk4, 'YH');
  addClaim(me, sw, 'OT8');
  addClaim(me, music, 'SN'); addClaim(me, music, 'WY');
  addClaim(me, mex, 'SH');
  const ch = (go, kind, label, amount, due) => D.charges.push({id:uid(), joiner_id:me, group_order_id:go.id, kind, label, amount, due});
  ch(fromm,'doms','US Tracked shipping (Fromm 2.0)',4.00,true);
  ch(mini,'doms','US Stamped shipping (Mini Fanmeet)',2.00,true);
  ch(jjmuze,'doms','US Stamped shipping (JJMuze)',2.00,true);
  ch(mk4,'doms','US Stamped shipping (Makestar 4.0)',2.00,false);
  ch(book,'doms','US Tracked shipping (Before Sleep Book)',6.50,false);
  D.payments.push({id:uid(), joiner_id:me, group_order_id:null, amount:150, method:'venmo', paid_on:'2026-08-02', note:'Fromm, Mini Fanmeet, Makestar, JJMuze'});
  D.payments.push({id:uid(), joiner_id:me, group_order_id:null, amount:118, method:'paypal', paid_on:'2026-09-05', note:'Soundwave, Musicart, Before Sleep Book'});

  // everyone else
  const units = ['HJ/SH','YH/MG','YS/WY','SN/JH'];
  people.slice(1).forEach(([name]) => {
    const jid = 'j-' + name;
    [fromm,mini,jjmuze,mk4,sw,mk7,music,mex,kong,wm,th].filter(() => rnd() > 0.35).forEach(g => {
      const k = 1 + Math.floor(rnd() * 3);
      const pool = isUnitGO(g) ? units : MEMBERS;
      const chosen = new Set(); for (let i = 0; i < k; i++) chosen.add(pick(pool));

  // put every claim in its priority group (their own spots, extra claims, GOM)
  [kong, th].forEach(g => planSync(g, D.comeback_roster.filter(r => r.comeback_id === g.comeback_id), D.claims.filter(c => c.group_order_id === g.id), 'j-krystal_dagger', false)
    .fix.forEach(f => Object.assign(D.claims.find(c => c.id === f.id), f)));
  return D;
}

  const demoAuth = (handle, pin) => { const a = db.joiner_accounts.find(x => x.handle === normHandle(handle)); return a && pin === '1234' ? a.joiner_id : null; };
  const isOpen = g => g && g.status === 'open' && !(g.deadline && today() > g.deadline);
  return {
    demo: true,
    async loadPublic() {

        stats: statsMap(), comebacks: db.comebacks, seats: seatList()});
    },
    async login(handle, pin) {
      const a = db.joiner_accounts.find(x => x.handle === normHandle(handle));
      const j = a && db.joiners.find(x => x.id === a.joiner_id);
      if (!j || pin !== '1234') return {error:'invalid'};
      const strip = ({joiner_id, created_at, ...r}) => r;
      return clone({joiner:{id:j.id, name:j.name, emoji:j.emoji, is_host:!!j.is_host},
        handles: db.joiner_accounts.filter(x => x.joiner_id === j.id).map(x => x.handle),

        participation: db.participants.filter(c => c.joiner_id === j.id).map(({joiner_id, ...r}) => r),
        roster: db.comeback_roster.filter(r => r.joiner_id === j.id).map(({joiner_id, id, ...r}) => r),
        emojis: db.comeback_emojis.filter(e => e.joiner_id === j.id).map(({comeback_id, emoji}) => ({comeback_id, emoji}))});
    },
    async isAdmin() { return admin; },
    async adminSignIn(email, pw) { if (pw !== 'demo') throw new Error('In demo mode the host password is "demo".'); admin = true; },
    async adminSignOut() { admin = false; },
    async list(t, eq) {
      let r = db[t]; if (eq) r = r.filter(x => Object.entries(eq).every(([k, v]) => x[k] === v));
      return clone(r);
    },
    async save(t, row) {
      row = clone(row); const list = db[t];
      if (t === 'comeback_emojis') {
        const i = list.findIndex(x => x.comeback_id === row.comeback_id && x.joiner_id === row.joiner_id);
        if (i >= 0) list[i] = {...list[i], ...row}; else list.push(row); return row;
      }
      if (t === 'participants') {
        const i = list.findIndex(x => x.group_order_id === row.group_order_id && x.joiner_id === row.joiner_id);
        if (i >= 0) list[i] = {...list[i], ...row}; else list.push(row); return row;
      }
      if (t === 'joiner_accounts') {
        if (list.some(x => x.handle === row.handle)) throw new Error('The handle @' + row.handle + ' already belongs to a joiner.');
        list.push(row); return row;
      }
      if (row.id) { const i = list.findIndex(x => x.id === row.id); if (i >= 0) { list[i] = {...list[i], ...row}; return clone(list[i]); } }
      row.id = row.id || uid(); row.created_at = row.created_at || new Date().toISOString();
      if (t === 'joiners') row.pin_hash = row.pin_hash || null;
      list.push(row);
      if (t === 'claims' && !db.participants.some(p => p.group_order_id === row.group_order_id && p.joiner_id === row.joiner_id))
        db.participants.push({group_order_id:row.group_order_id, joiner_id:row.joiner_id, shipping_type:null, shipped:false, tracking:null, note:null});
      return clone(row);
    },
    async saveMany(t, rows) { for (const r of rows) await this.save(t, r); },
    async remove(t, id) {
      db[t] = db[t].filter(x => x.id !== id);
      if (t === 'joiners') ['joiner_accounts','claims','participants','charges','payments'].forEach(k => { db[k] = db[k].filter(x => x.joiner_id !== id); });
      if (t === 'group_orders') ['claims','participants'].forEach(k => { db[k] = db[k].filter(x => x.group_order_id !== id); });
      if (t === 'comebacks') { ['comeback_roster','comeback_emojis'].forEach(k => { db[k] = db[k].filter(x => x.comeback_id !== id); }); db.group_orders.forEach(g => { if (g.comeback_id === id) g.comeback_id = null; }); }
    },
    async setHandles(jid, handles) {
      const others = db.joiner_accounts.filter(a => a.joiner_id !== jid);
      const clash = handles.find(h => others.some(a => a.handle === h));
      if (clash) throw new Error('The handle @' + clash + ' already belongs to another joiner.');
      db.joiner_accounts = others.concat(handles.map(h => ({handle:h, joiner_id:jid, platform:'instagram'})));
    },
    async setPin(jid, pin) { const j = db.joiners.find(x => x.id === jid); if (j) j.pin_hash = 'demo'; },
    async uploadImage(full, thumb) {   // demo keeps pictures in memory as data URLs
      const read = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(new Error('Could not read that picture.')); r.readAsDataURL(b); });
      return {src: await read(full), thumb: await read(thumb)};
    },
    async removeImages() {},
    async clearRoster(cbId) { ['comeback_roster','comeback_emojis'].forEach(k => { db[k] = db[k].filter(x => x.comeback_id !== cbId); }); },
    async joinerClaim(handle, pin, goId, members) {     // same rules as the joiner_claim function in schema.sql
      const jid = demoAuth(handle, pin); if (!jid) return {error:'invalid'};
      const g = db.group_orders.find(x => x.id === goId);
      if (!g || !g.claims_on_site || g.status !== 'open') return {error:'closed'};
      if (g.deadline && today() > g.deadline) return {error:'deadline'};
      if (g.price_per_pc == null) return {error:'no_price'};
      const R = rowsOf(g), codes = (members || []).map(x => String(x).trim().toUpperCase()).filter(Boolean);
      if (!codes.length) return {error:'nothing'};
      if (codes.length > 40) return {error:'too_many'};
      const bad = codes.find(c => c !== 'OT8' && !R.includes(c)); if (bad) return {error:'bad_member', detail:bad};
      const j = db.joiners.find(x => x.id === jid);
      const roster = g.comeback_id && g.roster_required ? db.comeback_roster.filter(r => r.comeback_id === g.comeback_id) : [];
      const onList = roster.some(r => r.joiner_id === jid);
      let k = 0;
      codes.forEach(c => {
        const spots = roster.filter(r => r.joiner_id === jid && c !== 'OT8' && c.split('/').includes(r.member_code));
        const haveStanding = db.claims.some(x => x.group_order_id === goId && x.joiner_id === jid && x.member_code === c && x.status === 'filled' && ['fixed', 'soft', 'gom'].includes(x.source));
        db.claims.push({id:uid(), group_order_id:goId, joiner_id:jid, member_code:c, items:c === 'OT8' ? 8 : R === UNIT_ROWS ? 2 : 1,
          price: c === 'OT8' ? (g.ot8_price ?? r2(g.price_per_pc * R.length)) : g.price_per_pc, status:'filled', note:null,
          source: claimSourceFor(g, {isHost:!!(j && j.is_host), onList, spots, haveStanding, code:c}), roster_pos:null,
          created_at:new Date(Date.now() + k++).toISOString()});
      });
      if (!db.participants.some(p => p.group_order_id === goId && p.joiner_id === jid)) db.participants.push({group_order_id:goId, joiner_id:jid, shipping_type:null, shipped:false, tracking:null, note:null});
      return {ok:true, added:codes.length};
    },
    async joinerUnclaim(handle, pin, claimId) {
      const jid = demoAuth(handle, pin); if (!jid) return {error:'invalid'};
      const c = db.claims.find(x => x.id === claimId && x.joiner_id === jid && x.status === 'filled'); if (!c) return {error:'not_found'};
      if (!isOpen(db.group_orders.find(x => x.id === c.group_order_id))) return {error:'closed'};
      // a fixed claim stays unless the joiner has an OT8 on the order
      if (c.source === 'fixed' && !db.claims.some(x => x.group_order_id === c.group_order_id && x.joiner_id === jid && x.member_code === 'OT8' && x.status === 'filled')) return {error:'fixed'};
      c.status = 'dropped'; return {ok:true};
    },
  };
}

/* =====================================================================
   5. SUPABASE API  (used once you add your keys)
   ===================================================================== */
function supabaseApi() {
  if (!window.supabase) throw new Error('Could not load the Supabase library. Check your internet connection.');
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ORDER = {joiner_accounts:['handle'], participants:['group_order_id','joiner_id'], go_stats:['group_order_id'], public_shipments:['number'], order_seats:['claim_id'], comeback_emojis:['comeback_id','joiner_id']};
  const fail = e => {
    const m = e.message || String(e);
    if (/schema cache|column .* does not exist/i.test(m)) throw new Error('The database is missing newer columns or tables. In Supabase, run upgrade-photos-calendar.sql (photos and dates) and upgrade-sets-comeback.sql (set rules and the comeback list), then reload this page.');
    throw new Error(m);
  };

  async function all(t, eq) {          // reads every row, 1000 at a time
    const out = [];
    for (let from = 0; ; from += 1000) {
      let q = sb.from(t).select('*');
      if (eq) Object.entries(eq).forEach(([k, v]) => { q = q.eq(k, v); });
      (ORDER[t] || ['id']).forEach(c => { q = q.order(c); });
      const {data, error} = await q.range(from, from + 999);
      if (error) fail(error);
      out.push(...data);
      if (data.length < 1000) break;
    }
    return out;
  }
  return {
    demo: false,
    async loadPublic() {
      const soft = pr => pr.catch(() => []);     // an older database without the sets upgrade still loads
      const [drops, gos, shipments, st, comebacks, seats] = await Promise.all([all('drops'), all('group_orders'), all('public_shipments'), all('go_stats'), soft(all('comebacks')), soft(all('order_seats'))]);
      return {drops, gos, shipments, comebacks, seats: seats.map(({claim_id, ...r}) => ({id:claim_id, ...r})),
        stats: Object.fromEntries(st.map(s => [s.group_order_id, {joiners:s.joiners, items:s.items}]))};
    },
    async login(handle, pin) {
      const {data, error} = await sb.rpc('joiner_dashboard', {p_handle:handle, p_pin:pin});
      if (error) fail(error); return data;
    },
    async isAdmin() {
      const {data:{session:s}} = await sb.auth.getSession();
      if (!s) return false;
      const {data, error} = await sb.rpc('is_admin');
      return !error && data === true;
    },
    async adminSignIn(email, password) { const {error} = await sb.auth.signInWithPassword({email, password}); if (error) fail(error); },
    async adminSignOut() { await sb.auth.signOut(); },
    list: (t, eq) => all(t, eq),
    async save(t, row) {
      let q;
      if (t === 'participants') q = sb.from(t).upsert(row, {onConflict:'group_order_id,joiner_id'});
      else if (t === 'comeback_emojis') q = sb.from(t).upsert(row, {onConflict:'comeback_id,joiner_id'});
      else if (row.id) { const {id, ...rest} = row; q = sb.from(t).update(rest).eq('id', id); }
      else q = sb.from(t).insert(row);
      const {data, error} = await q.select();
      if (error) fail(error); return data[0];
    },
    async saveMany(t, rows) { const {error} = await sb.from(t).insert(rows); if (error) fail(error); },
    async remove(t, id) { const {error} = await sb.from(t).delete().eq('id', id); if (error) fail(error); },
    async setHandles(jid, handles) {
      let r = await sb.from('joiner_accounts').delete().eq('joiner_id', jid); if (r.error) fail(r.error);
      r = await sb.from('joiner_accounts').insert(handles.map(h => ({handle:h, joiner_id:jid, platform:'instagram'}))); if (r.error) fail(r.error);
    },
    async setPin(jid, pin) { const {error} = await sb.rpc('admin_set_pin', {p_joiner_id:jid, p_pin:pin}); if (error) fail(error); },
    async uploadImage(full, thumb) {
      const bucket = sb.storage.from(IMG_BUCKET), id = uid(), names = [`${id}.jpg`, `${id}-t.jpg`];
      const up = async (name, blob) => {
        const {error} = await bucket.upload(name, blob, {contentType:'image/jpeg', cacheControl:'31536000'});
        if (error) throw error;
        return bucket.getPublicUrl(name).data.publicUrl;
      };
      try { return {src: await up(names[0], full), thumb: await up(names[1], thumb)}; }
      catch (e) {
        await bucket.remove(names).catch(() => {});
        const m = e.message || String(e);
        throw new Error(/row-level security|not found|bucket|jwt/i.test(m)
          ? 'Picture upload is not set up yet, or you are signed out. Run upgrade-photos-calendar.sql in Supabase, then sign in again.' : m);
      }
    },
    async joinerClaim(handle, pin, goId, members) {
      const {data, error} = await sb.rpc('joiner_claim', {p_handle:handle, p_pin:pin, p_order:goId, p_members:members}); if (error) fail(error); return data;
    },
    async joinerUnclaim(handle, pin, claimId) {
      const {data, error} = await sb.rpc('joiner_unclaim', {p_handle:handle, p_pin:pin, p_claim:claimId}); if (error) fail(error); return data;
    },
    async clearRoster(cbId) {
      for (const t of ['comeback_roster', 'comeback_emojis']) { const {error} = await sb.from(t).delete().eq('comeback_id', cbId); if (error) fail(error); }
    },
    async removeImages(list) {
      const names = list.flatMap(im => [im.src, im.thumb]).map(u => { const m = String(u || '').match(new RegExp('/' + IMG_BUCKET + '/([^?]+)')); return m && decodeURIComponent(m[1]); }).filter(Boolean);
      if (!names.length) return;
      const {error} = await sb.storage.from(IMG_BUCKET).remove([...new Set(names)]); if (error) fail(error);
    },
  };
}

function calEvents() {
  const ev = [], gById = new Map(S.pub.gos.map(g => [g.id, g])), t = today();
  const push = e => ev.push({end:null, note:'', sub:'', ...e});
  S.pub.gos.forEach(g => {
    if (g.deadline && g.status !== 'cancelled')
      push({kind:'deadline', date:String(g.deadline).slice(0, 10), title:g.name, emoji:g.emoji, label:'Order deadline', short:'Due', note:g.deadline_time || '', goId:g.id, imgKey:'go:' + g.id});
  });
  S.pub.drops.forEach(d => {
    if (d.status === 'skipped') return;
    const g = d.group_order_id && gById.get(d.group_order_id);
    if (g && g.status === 'cancelled') return;
    const T = EVT_NAME[d.drop_type];
    const base = {title:d.name, sub:d.store || '', emoji:g && g.emoji, goId:g && g.id, link:d.link, imgKey:'drop:' + d.id};
    if (d.deadline && !(g && g.deadline)) push({...base, kind:'deadline', date:String(d.deadline).slice(0, 10), label:'Order deadline', short:'Due', note:d.deadline_time || ''});
    if (d.winners_on) push({...base, kind:'announce', date:String(d.winners_on).slice(0, 10), label:T ? `${T} winners announced` : 'Winners announced', short:'Winners', note:d.winners_note || ''});
    if (d.event_on) push({...base, kind:'event', date:String(d.event_on).slice(0, 10), end:d.event_end_on ? String(d.event_end_on).slice(0, 10) : null,
      label:T ? `${T} date` : 'Event date', short:EVT_SHORT[d.drop_type] || 'Event', note:d.event_note || ''});
  });
  ev.forEach(e => { e.past = (e.end || e.date) < t; });
  return ev.sort((a, b) => a.date.localeCompare(b.date) || KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || a.title.localeCompare(b.title));
}
const evWhen = e => { const t = today(); return e.end && e.date <= t && t <= e.end ? 'Happening now' : whenChip(e.date); };

function evRow(e, inDay) {
  const items = galleryItems(e.imgKey);
  const tile = items.length ? pcCover(e.imgKey, items, e.title) : `<span class="pc-ph" aria-hidden="true">${esc(e.emoji || '🎫')}</span>`;
  const link = e.goId ? '<a class="small" href="#/orders">See order</a>' : e.link ? `<a class="small" href="${esc(e.link)}" target="_blank" rel="noopener">Details</a>` : '';
  return `<div class="ev${e.past ? ' past' : ''}">${tile}
    <div><h3>${esc(e.title)}</h3><p class="meta"><span class="pill ${KINDS[e.kind].pill}">${esc(e.label)}</span>

    <div class="ev-r">${inDay ? '' : `<span class="small muted">${esc(evWhen(e))}</span>`}${link}</div></div>`;
}

function monthView(events) {
  const [Y, M] = CAL.month.split('-').map(Number);
  const lead = new Date(Y, M - 1, 1).getDay(), total = new Date(Y, M, 0).getDate(), weeks = Math.ceil((lead + total) / 7), t = today();
  const byDay = new Map();
  events.forEach(e => {
    let d = e.date; const last = e.end || e.date;
    for (let n = 0; d <= last && n < 45; n++, d = addDays(d, 1)) { if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(e); }
  });
  const cells = [];
  for (let i = 0; i < weeks * 7; i++) {
    const dt = new Date(Y, M - 1, 1 - lead + i), key = ymd(dt), list = byDay.get(key) || [];
    const rest = list.length - 2;
    cells.push(`<button type="button" class="day${dt.getMonth() !== M - 1 ? ' out' : ''}${key === t ? ' today' : ''}${key === CAL.sel ? ' sel' : ''}" data-action="calSel" data-date="${key}" aria-pressed="${key === CAL.sel}" aria-label="${esc(fmtFull(key))}, ${list.length ? list.length + (list.length === 1 ? ' date' : ' dates') : 'nothing scheduled'}">
      <span class="dn">${dt.getDate()}</span>
      ${list.slice(0, 2).map(e => `<span class="ep k-${e.kind}${e.past ? ' past' : ''}"><b>${esc(e.short)}</b> ${esc(e.title)}</span>`).join('')}
      ${rest > 0 ? `<span class="epm">+${rest} more</span>` : ''}
      <span class="dots">${list.slice(0, 4).map(e => `<i class="k-${e.kind}"></i>`).join('')}</span></button>`);
  }
  const selList = byDay.get(CAL.sel) || [];
  const next = [...byDay.keys()].filter(k => k > CAL.sel).sort()[0];
  return `<div class="month"><div class="wk hd" aria-hidden="true">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x => `<div>${x}</div>`).join('')}</div><div class="wk">${cells.join('')}</div></div>
    <section class="panel daypanel" aria-label="Selected day"><h2>${esc(fmtFull(CAL.sel))}<span class="pill">${esc(whenChip(CAL.sel))}</span></h2>
      ${selList.length ? `<div class="evs">${selList.map(e => evRow(e, true)).join('')}</div>` : `<p class="muted small" style="margin:0">Nothing scheduled that day.${next ? ` <button type="button" class="btn ghost small" data-action="calSel" data-date="${next}" style="margin-left:6px">Next date: ${esc(fmtLong(next))}</button>` : ''}</p>`}</section>`;
}

function listView(events) {
  const t = today();
  const shown = events.filter(e => CAL.past || (e.end || e.date) >= t);
  if (!shown.length) return `<div class="empty"><p>${events.length ? 'No upcoming dates.' : 'No dates on the calendar yet.'}</p></div>`;
  const groups = new Map();
  shown.forEach(e => { const k = e.end && e.date < t && e.end >= t ? t : e.date; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  return `<div class="evs">${[...groups].map(([d, list]) => `<h3 class="evd">${esc(fmtFull(d))}<span>${esc(whenChip(d))}</span></h3>${list.map(evRow).join('')}`).join('')}</div>`;
}

function pageCalendar() {
  const events = calEvents().filter(e => CAL.kinds[e.kind]);
  const [Y, M] = CAL.month.split('-').map(Number);
  const monthName = new Date(Y, M - 1, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'});

  const bar = `<div class="calbar">
    <div class="seg" role="group" aria-label="Calendar view">${seg('month', 'Month')}${seg('list', 'List')}</div>
    ${CAL.view === 'month'
      ? `<div class="calnav"><button type="button" class="icon-btn" data-action="calMove" data-step="-1" aria-label="Previous month">‹</button><h2 aria-live="polite">${esc(monthName)}</h2><button type="button" class="icon-btn" data-action="calMove" data-step="1" aria-label="Next month">›</button><button type="button" class="btn ghost small" data-action="calMove" data-step="today">Today</button></div>`

function computeMe(d) {
  const anC = new Map(), anFor = g => { if (!anC.has(g.id)) anC.set(g.id, anOf(g)); return anC.get(g.id); };
  const live = d.claims.filter(c => { const g = goById(c.group_order_id); return g && g.status !== 'cancelled'; });
  const filled = live.filter(c => c.status === 'filled'), dropped = live.filter(c => c.status === 'dropped');
  const infoOf = new Map(filled.map(c => { const g = goById(c.group_order_id); return [c.id, claimInfo(g, c, anFor(g))]; }));
  const share = (c, k) => { const i = infoOf.get(c.id); return i.seats.length ? c.items * i.seats.filter(s => s.state === k).length / i.total : (k === 'in' ? c.items : 0); };
  const liveCharges = d.charges.filter(c => { const g = c.group_order_id && goById(c.group_order_id); return !g || g.status !== 'cancelled'; });
  const dueCh = liveCharges.filter(c => c.due), futCh = liveCharges.filter(c => !c.due);
  const claimsCost = sum(filled, c => infoOf.get(c.id).amount), feesDue = sum(dueCh, c => c.amount);
  const totalDue = r2(claimsCost + feesDue), paid = sum(d.payments, p => p.amount);
  const active = S.pub.gos.filter(g => g.status !== 'cancelled');
  const joinedIds = new Set(filled.filter(c => infoOf.get(c.id).state !== 'wait' && infoOf.get(c.id).state !== 'dropped').map(c => c.group_order_id));
  const joined = active.filter(g => joinedIds.has(g.id)).length;
  const byAlbum = ALBUM_TYPES.map(t => {
    const cs = filled.filter(c => goById(c.group_order_id).album_type === t);
    return {type:t, items:sum(cs, c => share(c, 'in')), cost:sum(cs, c => infoOf.get(c.id).amount)};
  }).filter(x => x.items > 0 || x.cost > 0);
  return {live, filled, dropped, dueCh, futCh, claimsCost, feesDue, totalDue, paid, balance:r2(totalDue - paid), infoOf,
    active:active.length, joined, pct:active.length ? Math.round(joined / active.length * 100) : 0,
    pendingCost: sum(filled, c => infoOf.get(c.id).pendingBase),
    itemsFilled: sum(filled, c => share(c, 'in')),
    itemsWaiting: sum(filled, c => share(c, 'wait') + share(c, 'pending')),
    itemsDropped: r2(sum(dropped, c => c.items) + sum(filled, c => share(c, 'dropped'))), byAlbum};
}
const chipsMe = (cs, infoOf) => cs.map(c => {
  const i = infoOf.get(c.id);
  const cls = c.status === 'dropped' ? 'x' : !i ? '' : i.state === 'wait' ? 'wait' : i.state === 'pending' || i.state === 'dropped' ? 'risk' : '';
  const note = !i ? '' : i.state === 'wait' ? 'waitlist' : i.state === 'pending' ? 'needs more' : i.state === 'dropped' ? 'set dropped' : i.extra ? '+' + money(i.extra) : '';
  return `<span class="chip ${cls}" ${c.status === 'dropped' ? 'title="Dropped"' : ''}>${esc(c.member_code)}${note ? `<small>${esc(note)}</small>` : ''}</span>`;
}).join('');

function shipCell(g, p) {

function readForm(cfg, form) {

    if (f.t === 'images') { try { const v = JSON.parse(fd.get(f.k) || '[]'); out[f.k] = Array.isArray(v) ? v : []; } catch { out[f.k] = []; } continue; }

/* --- photo upload: resize in the browser, then store --- */
const loadImg = file => new Promise((ok, no) => {
  const u = URL.createObjectURL(file), im = new Image();
  im.onload = () => { URL.revokeObjectURL(u); ok(im); };
  im.onerror = () => { URL.revokeObjectURL(u); no(new Error(`Could not open ${file.name}. Try a JPG or PNG.`)); };
  im.src = u;
});
const toJpeg = (im, max, quality) => new Promise((ok, no) => {
  const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
  c.toBlob(b => b ? ok(b) : no(new Error('Could not resize that picture.')), 'image/jpeg', quality);
});
async function processImage(file) {
  if (!/^image\//.test(file.type)) throw new Error(`${file.name} is not a picture.`);
  if (file.size > 40 * 1024 * 1024) throw new Error(`${file.name} is too large (over 40 MB).`);
  const im = await loadImg(file);
  return {full: await toJpeg(im, 1200, .85), thumb: await toJpeg(im, 320, .8)};
}
async function addPhotos(input) {
  const w = input.closest('[data-imgs]'), form = input.closest('form'), msg = $('[data-imgmsg]', w), files = [...input.files];
  input.value = ''; if (!files.length) return;
  const list = readImgs(w);
  if (list.length + files.length > MAX_IMGS) { msg.textContent = `A drop can hold up to ${MAX_IMGS} photos.`; throw new Error(`A drop can hold up to ${MAX_IMGS} photos. Remove one first.`); }
  const saveBtn = $('.formacts .btn', form); saveBtn.disabled = true;
  let added = 0, firstErr = null;
  try {
    for (const f of files) {
      msg.textContent = `Uploading ${added + (firstErr ? 1 : 0) + 1} of ${files.length}...`;
      try { const {full, thumb} = await processImage(f); list.push(await api.uploadImage(full, thumb)); writeImgs(w, list); added++; }
      catch (e) { firstErr = firstErr || e; }
    }
  } finally { saveBtn.disabled = false; }
  msg.textContent = added ? `${added} ${added === 1 ? 'photo' : 'photos'} added. Press the save button to keep ${added === 1 ? 'it' : 'them'}.` : '';
  if (firstErr) throw firstErr;
}

function hostId() {

  if (j && 'is_host' in j && !j.is_host) { await api.save('joiners', {id, is_host:true}); j.is_host = true; }

async function syncOrder(go, roster, opts = {}) {

  const claims = await api.list('claims', {group_order_id:go.id});
  const plan = planSync(go, roster, claims, host, opts.add !== false);

// When the price changes, claims that still carry the old price move to the new one
async function repriceClaims(oldGo, go) {
  const claims = await api.list('claims', {group_order_id:go.id}); let n = 0;
  for (const c of claims) {
    const was = claimPrice(oldGo, c.member_code), now = claimPrice(go, c.member_code);
    if (Math.abs(num(c.price) - was) < 0.005 && Math.abs(was - now) >= 0.005) { await api.save('claims', {id:c.id, price:now}); n++; }
  }
  return n;
}

function buildPreview(text, go) {
  const accounts = new Map(A.data.joiner_accounts.map(a => [a.handle, a.joiner_id]));
  const rows = new Map(), issues = [];
  text.split('\n').map(s => s.trim()).filter(Boolean).forEach((line, i) => {
    const m = line.match(/^@?([A-Za-z0-9._]+)\s*[:\-,]?\s*(.*)$/);
    if (!m) { issues.push(`Line ${i + 1}: could not read "${line}"`); return; }
    const handle = normHandle(m[1]), toks = m[2].split(/[\s,]+/).filter(Boolean);
    if (!toks.length) { issues.push(`Line ${i + 1}: no claims after @${handle}`); return; }
    const row = rows.get(handle) || {handle, joinerId:accounts.get(handle) || null, claims:[]};
    toks.forEach(raw => {
      const code = raw.toUpperCase().replace(/\.$/, ''), parts = code.split('/');
      const R = rowsOf(go), okCode = code === 'OT8' || (hasSets(go) ? R.includes(code) : (parts.length <= 2 && parts.every(p => MEMBERS.includes(p))));
      if (!okCode) { issues.push(`Line ${i + 1}: "${raw}" is not OT8 or ${hasSets(go) ? `one of ${R.join(', ')} for this order` : `a member (${MEMBERS.join(', ')}) or a unit like HJ/SH`}`); return; }
      row.claims.push({code, items:claimItems(go, code), price:claimPrice(go, code)});
    });
    rows.set(handle, row);
  });
  return {rows:[...rows.values()], issues};
}

function buildCaption(go, claims, primary, emo, cb) {
  const price = go.price_per_pc != null ? `${money(go.price_per_pc)} per ${isUnitGO(go) ? 'unit' : 'PC'}${go.ot8_price != null ? `, OT8 ${money(go.ot8_price)}` : ''}` : '';
  const dl = go.deadline ? `Deadline: ${fmtDate(go.deadline)}${go.deadline_time ? ', ' + go.deadline_time : ''}` : '';
  const head = [`${go.emoji || ''} ${go.name}`.trim(), price, dl].filter(Boolean), isHost = jid => normHandle(primary(jid)) === normHandle(CONFIG.INSTAGRAM);
  const who = jid => isHost(jid) ? `${emo(jid) || '💎'} GOM` : `${emo(jid) || '❔'} @${primary(jid)}`;
  const live = claims.filter(c => c.status !== 'dropped').map(c => ({...c, emoji:emo(c.joiner_id)})).sort(claimCmp);
  const ot8 = live.filter(c => c.member_code === 'OT8'), ot8Line = `OT8: ${ot8.map(c => em(c.emoji)).join('') || '✅'}`;
  const seen = []; const see = jid => { if (!seen.includes(jid)) seen.push(jid); };
  if (hasSets(go)) {
    const an = analyze(go, live, cb);
    const line = r => {
      const cells = []; for (let n = 1; n <= an.N; n++) { const s = an.sets[n - 1] && an.sets[n - 1].cells[r]; cells.push(s ? em(s.claim.emoji) : '✅'); }
      const w = an.seats.filter(x => x.row === r && x.pos > an.N).sort((a, b) => a.pos - b.pos).map(x => em(x.claim.emoji));
      return an.gated ? `${r}: ${cells.join('')} | ${w.join('') || '✅'}` : `${r}: ${cells.join('') || '✅'}`;
    };
    an.R.forEach(r => an.seats.filter(x => x.row === r).sort((a, b) => a.pos - b.pos).forEach(x => see(x.claim.joiner_id)));
    ot8.forEach(c => see(c.joiner_id));
    return [...head, '', 'Availability:', ...an.R.map(line), ot8Line, '', ...seen.map(who)].join('\n');
  }
  const rows = new Map(); live.filter(c => c.member_code !== 'OT8').forEach(c => { if (!rows.has(c.member_code)) rows.set(c.member_code, []); rows.get(c.member_code).push(c.joiner_id); });
  const e1 = jid => emo(jid) || '❔';
  const codes = [...MEMBERS, ...[...rows.keys()].filter(k => !MEMBERS.includes(k))];
  const lines = codes.filter(c => MEMBERS.includes(c) || rows.has(c)).map(c => `${c}: ${(rows.get(c) || []).map(e1).join('') || '✅'}`);
  live.forEach(c => see(c.joiner_id));
  return [...head, '', 'Availability:', ...lines, ot8Line, '', ...seen.map(who)].join('\n');
}
